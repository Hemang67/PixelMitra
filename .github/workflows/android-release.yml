name: PixelMitra Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Flutter Android platform files
        working-directory: mobile
        run: flutter create --project-name pixelmitra --org com.hemang67 --platforms android .

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze and test
        working-directory: mobile
        run: |
          flutter analyze
          flutter test

      - name: Decode Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo 'Missing ANDROID_KEYSTORE_BASE64' && exit 1)
          mkdir -p "$RUNNER_TEMP/android-signing"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.p12"

      - name: Configure signing properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" || (echo 'Missing keystore password' && exit 1)
          test -n "$KEY_ALIAS" || (echo 'Missing key alias' && exit 1)
          cat > mobile/android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/android-signing/release.p12
          EOF

      - name: Configure release signing
        run: python3 .github/scripts/configure_android_signing.py

      - name: Build signed APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Prepare release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "PixelMitra-${VERSION}-release.apk"
          sha256sum "PixelMitra-${VERSION}-release.apk" > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            PixelMitra-*-release.apk
            SHA256SUMS.txt
